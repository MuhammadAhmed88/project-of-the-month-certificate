
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project of the Month | Certificate</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #e8ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .certificate-container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .certificate {
            width: 100%;
            height: 85vh;
            min-height: 400px;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: center;
            }

            .certificate-container {
                padding: 5px;
            }

            .certificate {
                height: 85vh;
                min-height: 500px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .certificate {
                height: 90vh;
                min-height: 450px;
            }
        }
    </style>
</head>

<body>

    <div class="certificate-container">

        <iframe
            class="certificate"
            src="Certificate_October_2026_PHP_MySQL.pdf#toolbar=0&navpanes=0&view=Fit"
            title="Project of the Month Certificate">
        </iframe>

    </div>

</body>
</html>
